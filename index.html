<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五笔字型练习</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E五%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">

  <header>
    <h1>五笔字型练习</h1>
    <div class="tabs">
      <button class="tab active" data-mode="root">字根练习</button>
      <button class="tab" data-mode="char">单字练习</button>
      <button class="tab" data-mode="text">文章练习</button>
    </div>
    <div class="tabs tabs--ver" role="group" aria-label="五笔版本切换">
      <button class="tab tab--ver active" data-ver="86" title="五笔字型 86 版（1986）">86版</button>
      <button class="tab tab--ver" data-ver="98" title="王码五笔字型 98 版（1998）">98版</button>
      <button class="tab tab--ver" data-ver="06" title="新世纪版五笔字型（2008）">新世纪版</button>
    </div>
    <div class="spacer"></div>
    <button class="tab tab--ghost" id="resetBtn">重置统计</button>
  </header>

  <div class="panel" id="panel">
    <div class="panel-main" id="panelMain">
      <div id="stageRoot" class="stage">
        <div class="prompt">这个字根在哪个键上？</div>
        <div class="big root-font" id="rootDisplay">—</div>
      </div>

      <div id="stageChar" class="stage hidden">
        <div class="text-picker hidden" id="textPicker">
          <select id="textSelect" aria-label="选择文章"></select>
          <button class="picker-restart" id="textRestart" title="从本篇开头重新开始" aria-label="重新开始本篇">↺</button>
        </div>
        <div class="prompt" id="charPrompt">请敲出这个字的五笔编码</div>
        <div class="big" id="charDisplay">—</div>
        <div class="slots" id="slots"></div>
        <div class="ticker hidden" id="textTicker"></div>
      </div>

      <div class="feedback" id="feedback"></div>
    </div>

    <div class="teach" id="teach"></div>
  </div>

  <div class="keyboard" id="keyboard"></div>

  <div class="stats">
    <div class="stat"><span class="k">正确</span><span class="v ok" id="statRight">0</span></div>
    <div class="stat"><span class="k">错误</span><span class="v bad" id="statWrong">0</span></div>
    <div class="stat"><span class="k">正确率</span><span class="v ac" id="statAcc">—</span></div>
    <div class="stat"><span class="k">连击</span><span class="v" id="statStreak">0</span></div>
    <div class="stat"><span class="k">最高连击</span><span class="v" id="statBest">0</span></div>
  </div>

  <div class="hint-tip">
    直接敲键盘字母键作答 · 无需切换输入法<br>
    键帽下方数字为「区号+位号」· 顶部可切换 86 / 98 / 新世纪版字库<br>
    答错后按 <b>空格</b> / <b>回车</b>，或点按讲解卡 / 题目区继续（文章模式无需按键，续输更正）；<br>
    文章模式中淡出的标点等无编码字符自动跳过 · ↺ 从本篇开头重新开始
  </div>
</div>

<!-- 静态脚本：defer 保证按书写顺序执行，可直接双击 index.html 运行 -->
<script src="js/data/keys.js" defer></script>
<script src="js/data/chars.js" defer></script>
<script src="js/data/codes.js" defer></script>
<script src="js/data/texts.js" defer></script>
<script src="js/core/state.js" defer></script>
<script src="js/core/pools.js" defer></script>
<script src="js/ui/elements.js" defer></script>
<script src="js/ui/keyboard.js" defer></script>
<script src="js/ui/stage.js" defer></script>
<script src="js/ui/feedback.js" defer></script>
<script src="js/ui/teach.js" defer></script>
<script src="js/ui/stats.js" defer></script>
<script src="js/core/practice.js" defer></script>
<script src="js/main.js" defer></script>
</body>
</html>
